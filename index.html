<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Yann Leduc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Charte Arts et Métiers 2023 : violet #80276C et jaune orangé #ffa300, sur fond blanc.
   Idée : un dossier d'ingénieur éditorial. Grand nom en tête, une règle graduée pour les semestres,
   chaque projet ouvert comme un dossier illustré, étape par étape. */
:root {
  --paper: #ffffff;
  --tint: #faf7fa;
  --ink: #1f1a24;
  --muted: #625b69;
  --rule: #e9e4eb;
  --accent: #80276c;
  --accent-deep: #5e1a4f;
  --accent-soft: #f4e9f1;
  --gold: #ffa300;
  --gold-soft: #fff4de;
  --gold-ink: #7a4b00;
  --ok: #00806f;
  --ok-soft: #e3f4f1;
  --todo: #7a4b00;
  --todo-soft: #fff4de;
  --font-display: "Zilla Slab", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", "Source Sans Pro", Verdana, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
  --wrap: 1180px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
img, video { max-width: 100%; display: block; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.08; text-wrap: balance; margin: 0; color: var(--ink); }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 28px; }
@media (max-width: 520px) { .wrap { padding: 0 18px; } }
.kicker { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.lead { font-size: 19px; color: var(--muted); max-width: 56ch; }

/* Barre de lecture */
#progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--gold); z-index: 30; }

/* En-tête */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--gold); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
.tab { font-family: var(--font-mono); font-size: 13.5px; text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 999px; }
.tab:hover { color: var(--accent); background: var(--accent-soft); }
.tab[aria-current="page"] { color: #fff; background: var(--accent); }
.tab.empty { opacity: .5; }

main { padding: 0 0 96px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 16px var(--font-body); text-decoration: none; padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent); background: #fff; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-deep); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.ai-tag { position: absolute; right: 12px; bottom: 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); background: rgba(255,255,255,.88); border: 1px solid var(--rule); padding: 3px 8px; border-radius: 999px; }
figcaption .ai-tag { position: static; }

/* Accueil : hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: center; min-height: min(78vh, 760px); padding: 40px 0 24px; }
.hero-text { display: grid; gap: 22px; position: relative; z-index: 2; }
.mega { font-size: clamp(64px, 11vw, 156px); line-height: .9; letter-spacing: -0.02em; color: var(--accent); margin-left: -4px; }
.mega .dot { color: var(--gold); }
.hero-media { margin: 0 -28px 0 0; position: relative; }
.hero-media .hero-vid { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #fff; -webkit-mask-image: radial-gradient(ellipse 62% 70% at 58% 52%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 62% 70% at 58% 52%, #000 55%, transparent 100%); }
.hero-media figcaption { margin-top: 8px; text-align: right; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; min-height: 0; padding-top: 28px; }
  .hero-media { margin: 0 -18px; order: -1; }
}

/* Blocs numérotés */
.block { padding: 72px 0 0; }
.block.two { display: grid; grid-template-columns: 1fr 1.2fr; gap: 56px; }
@media (max-width: 860px) { .block.two { grid-template-columns: 1fr; gap: 40px; } }
.block-head { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; row-gap: 6px; align-items: baseline; margin-bottom: 28px; }
.block-head .idx { font-family: var(--font-mono); font-size: 13px; color: var(--gold-ink); background: var(--gold-soft); padding: 3px 8px; border-radius: 4px; }
.block-head h2 { font-size: clamp(30px, 3.6vw, 42px); }
.block-head p { grid-column: 2; color: var(--muted); }
.mini { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }

/* Règle graduée des semestres */
.ruler { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 2px solid var(--ink); padding-top: 26px; }
.ruler-scale { position: absolute; left: 0; right: 0; top: 0; height: 12px; background:
  repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px calc(100% / 36)),
  repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px calc(100% / 6)); background-size: 100% 6px, 100% 12px; background-repeat: no-repeat; }
.ruler-now { position: absolute; top: -10px; width: 3px; height: 26px; border-radius: 2px; background: var(--gold); z-index: 2; pointer-events: none; }
.ruler-now span { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11.5px; color: var(--gold-ink); background: var(--gold-soft); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.rs { display: grid; gap: 8px; align-content: start; padding: 4px 16px 18px 0; text-decoration: none; color: var(--ink); border-right: 1px dashed var(--rule); margin-right: 16px; min-height: 150px; }
.rs:last-child { border-right: 0; margin-right: 0; }
.rs-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.rs-num { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; color: var(--accent); }
.rs.next .rs-num { color: #c9c0cd; }
.rs-year { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.rs-bar { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; display: block; }
.rs-bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.rs-bar.big { height: 8px; max-width: 420px; margin: 18px 0 8px; }
.rs-per { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.rs-what { font-size: 15px; font-weight: 600; line-height: 1.35; }
.rs.next .rs-what { color: #b3aab8; font-weight: 400; font-style: italic; }
.rs:hover .rs-num { color: var(--gold); }
@media (max-width: 860px) {
  .ruler { grid-template-columns: repeat(3, 1fr); row-gap: 24px; }
  .rs:nth-child(3n + 3) { border-right: 0; margin-right: 0; }
  .ruler-now, .ruler-scale { display: none; }
}
@media (max-width: 480px) { .ruler { grid-template-columns: repeat(2, 1fr); } .rs:nth-child(3n + 3) { border-right: 1px dashed var(--rule); margin-right: 16px; } .rs:nth-child(2n + 2) { border-right: 0; margin-right: 0; } }

/* Projet mis en avant */
.feature { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center; }
.feature-pic { position: relative; display: block; border-radius: var(--radius); overflow: hidden; background: var(--tint); }
.feature-pic img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
@media (prefers-reduced-motion: no-preference) { .feature-pic img, .proj-card .pic img { transition: transform .6s ease; } .feature-pic:hover img, .proj-card:hover .pic img { transform: scale(1.03); } }
.feature-body { display: grid; gap: 16px; }
.feature-body h2 { font-size: clamp(28px, 3.2vw, 38px); }
.feature-body h2 a { color: var(--ink); text-decoration: none; }
.feature-body h2 a:hover { color: var(--accent); }
.feature-body .figs { margin: 6px 0; grid-template-columns: repeat(2, 1fr); }
.feature-body .fig:nth-child(odd) { border-left: 0; padding-left: 0; }
.feature-body .fig:nth-child(n + 3) { border-top: 1px solid var(--rule); }
@media (max-width: 860px) { .feature { grid-template-columns: 1fr; gap: 24px; } }

/* Parcours */
.path { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--accent); display: grid; gap: 26px; }
.path li { position: relative; display: grid; gap: 2px; }
.path li::before { content: ""; position: absolute; left: -30px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
.path li:first-child::before { background: var(--gold); border-color: var(--gold); }
.path .k { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.path .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.2; }
.path .d { color: var(--muted); font-size: 15.5px; }

/* Puces */
.skills { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14.5px; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); }
.chip.tool { font-family: var(--font-mono); font-size: 12.5px; background: #fff; color: var(--ink); border: 1px solid var(--rule); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 999px; width: fit-content; }
.pill.live { background: var(--gold-soft); color: var(--gold-ink); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.todo { background: var(--todo-soft); color: var(--todo); }

/* Chiffres */
.figs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin: 40px 0 0; }
.figs.n3 { grid-template-columns: repeat(3, 1fr); }
.fig { padding: 16px 18px 18px 0; display: grid; gap: 4px; align-content: start; }
.fig + .fig { padding-left: 18px; border-left: 1px solid var(--rule); }
.fig .val { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.fig .lab { font-size: 14px; color: var(--muted); line-height: 1.4; }
@media (max-width: 760px) { .figs, .figs.n3 { grid-template-columns: repeat(2, 1fr); } .fig:nth-child(3) { border-left: 0; padding-left: 0; } .fig:nth-child(n + 3) { border-top: 1px solid var(--rule); } }

/* Pages semestre */
.crumbs { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; padding: 26px 0 0; }
.crumbs a { color: var(--muted); }
.sem-head { display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: center; padding: 36px 0 48px; }
.sem-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(110px, 18vw, 220px); line-height: .8; color: var(--accent); }
.sem-head h1 { font-size: clamp(34px, 4.4vw, 52px); margin: 6px 0 12px; }
@media (max-width: 700px) { .sem-head { grid-template-columns: 1fr; gap: 8px; } }
.empty-state { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; border: 1.5px dashed var(--rule); border-radius: var(--radius); padding: 36px; color: var(--muted); }
.empty-state strong { color: var(--ink); display: block; font-family: var(--font-display); font-size: 24px; margin-bottom: 4px; }
.sem-ghost { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 1; -webkit-text-stroke: 1.5px #d8cfdc; color: transparent; }
.proj-list { display: grid; gap: 24px; }
.proj-card { display: grid; grid-template-columns: 1.1fr 1fr; text-decoration: none; color: var(--ink); border-top: 2px solid var(--ink); padding-top: 24px; gap: 36px; }
.proj-card .pic { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--tint); }
.proj-card .pic img { width: 100%; height: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.proj-card .body { display: grid; gap: 14px; align-content: center; }
.proj-card h2 { font-size: clamp(28px, 3vw, 36px); }
.proj-card:hover h2 { color: var(--accent); }
.proj-card .go { font-weight: 700; color: var(--accent); }
@media (max-width: 760px) { .proj-card { grid-template-columns: 1fr; gap: 18px; } }

/* Page projet */
.proj-hero { position: relative; margin: 18px 0 0; }
.ph-media { position: relative; border-radius: var(--radius); overflow: hidden; background: #fff; }
.ph-media img, .ph-media video { width: 100%; aspect-ratio: 16 / 7.2; object-fit: cover; object-position: 70% 50%; }
.ph-text { position: absolute; left: 0; top: 0; bottom: 0; width: min(48%, 560px); display: grid; align-content: center; gap: 14px; padding: 0 0 0 40px; }
.ph-text h1 { font-size: clamp(32px, 4.2vw, 58px); color: var(--accent); }
.ph-text p { font-size: 18px; color: var(--muted); max-width: 40ch; }
@media (max-width: 860px) {
  .ph-text { position: static; width: auto; padding: 22px 0 0; }
  .ph-media img, .ph-media video { aspect-ratio: 16 / 9; object-position: 60% 50%; }
}
.proj-intro { display: grid; grid-template-columns: 1.5fr 1fr; gap: 48px; margin-top: 40px; align-items: start; }
.proj-intro .lede { font-size: 19px; line-height: 1.6; max-width: 62ch; }
.facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; padding: 20px 22px; background: var(--tint); border-radius: var(--radius); border-left: 4px solid var(--accent); }
.facts dt { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; }
@media (max-width: 860px) { .proj-intro { grid-template-columns: 1fr; gap: 24px; } }

/* Plan cliquable */
.plan { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 72px; align-items: center; }
@media (max-width: 860px) { .plan { grid-template-columns: 1fr; gap: 20px; } }
.plan h2 { font-size: clamp(28px, 3vw, 36px); }
.plan .consigne { color: var(--muted); margin: 8px 0 18px; }
.plan-fig { position: relative; margin: 0; background: var(--tint); border-radius: var(--radius); padding: 18px; background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 24px 24px; }
.plan-fig .inner { position: relative; }
.plan-fig img { width: 100%; height: auto; }
.rep { position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid #fff; background: var(--accent); color: #fff; font: 700 14px var(--font-body); cursor: pointer; box-shadow: 0 2px 8px rgba(94, 26, 79, .35); display: grid; place-items: center; padding: 0; text-decoration: none; }
.rep:hover, .rep.hot { background: var(--gold); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .rep { transition: background .15s, transform .15s; }
  .rep:hover, .rep.hot { transform: translate(-50%, -50%) scale(1.15); }
  .rep::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ping 2.8s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.7); opacity: .6; } 70% { transform: scale(1.4); opacity: 0; } 100% { opacity: 0; } }
}
@media (max-width: 480px) { .rep { width: 26px; height: 26px; font-size: 12px; } }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.legend a { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 9px 10px; border-radius: var(--radius); text-decoration: none; color: var(--ink); font-size: 15.5px; line-height: 1.4; }
.legend a:hover, .legend a.hot { background: var(--accent-soft); }
.legend .k { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 13px var(--font-body); display: grid; place-items: center; }
.legend .to { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-top: 2px; }

/* Niveau de lecture */
.modebar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 72px 0 0; padding: 16px 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); position: sticky; top: 64px; z-index: 10; background: rgba(255,255,255,.95); }
.modebar .lbl { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seg { display: inline-flex; border: 1.5px solid var(--accent); border-radius: 999px; padding: 3px; background: #fff; }
.seg button { font: 600 15px var(--font-body); border: 0; background: transparent; color: var(--accent); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.bref { display: none; font-size: 19px; max-width: 62ch; }
.court .bref { display: block; }
.court .txt, .court .tags, .court .deliv, .court .gallery .shot:not(:first-child), .court .viewer { display: none !important; }

/* Dossier : étapes */
.proj-layout { display: grid; grid-template-columns: 250px 1fr; gap: 56px; margin-top: 40px; align-items: start; }
@media (max-width: 960px) { .proj-layout { grid-template-columns: 1fr; gap: 20px; } }
.steps { position: sticky; top: 150px; display: grid; gap: 0; }
.steps .lbl { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.steps a { display: grid; grid-template-columns: 32px 1fr; gap: 6px; padding: 8px 10px; text-decoration: none; color: var(--muted); font-size: 15px; line-height: 1.35; border-left: 2px solid var(--rule); }
.steps a:hover { color: var(--ink); }
.steps a.on { color: var(--accent); border-left-color: var(--gold); font-weight: 600; background: linear-gradient(90deg, var(--gold-soft), transparent); }
.steps a .n { font-family: var(--font-mono); font-size: 12.5px; padding-top: 1px; }
@media (max-width: 960px) {
  .steps { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .steps .lbl { display: none; }
  .steps a { white-space: nowrap; border: 1px solid var(--rule); border-radius: 999px; grid-template-columns: auto auto; padding: 5px 12px; }
  .steps a.on { border-color: var(--accent); }
}
.parts { display: grid; gap: 80px; min-width: 0; }
.part { scroll-margin-top: 170px; min-width: 0; }
.part-ban { position: relative; border-radius: var(--radius); overflow: hidden; margin-bottom: 26px; background: var(--tint); }
.part-ban img { width: 100%; aspect-ratio: 21 / 8; object-fit: cover; }
.part-head { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: end; }
.part-head .n { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: .78; color: var(--accent); }
.part-head h2 { font-size: clamp(26px, 3vw, 36px); margin-top: 6px; }
.part-body { padding: 22px 0 0; display: grid; gap: 24px; }
.part-body .txt { display: grid; gap: 14px; max-width: 66ch; }
.part .figs { margin: 0; }
.tags { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 640px) { .tags { grid-template-columns: 1fr; } .part-head .n { font-size: 52px; } .part-ban img { aspect-ratio: 16 / 9; } }
.tags h3, .deliv h3 { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.deliv ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
.deliv li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.deliv li .dt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
@media (max-width: 480px) { .deliv li { grid-template-columns: 1fr auto; } .deliv li .dt { grid-column: 1; grid-row: 2; } }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.shot { margin: 0; display: grid; gap: 8px; }
.shot button { padding: 0; border: 1px solid var(--rule); background: #fff; border-radius: var(--radius); cursor: zoom-in; overflow: hidden; aspect-ratio: 16 / 10; }
.shot button img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.shot figcaption { font-size: 14px; color: var(--muted); line-height: 1.45; }
.viewer { display: grid; gap: 8px; }
.viewer model-viewer { width: 100%; height: 420px; background: radial-gradient(circle at 50% 40%, #ffffff, #efe8f0); border-radius: var(--radius); --poster-color: transparent; }
.viewer .cap { font-size: 14px; color: var(--muted); }

/* Calculateur */
.calc { border-radius: var(--radius); background: var(--tint); padding: 24px 26px; display: grid; gap: 18px; border-top: 4px solid var(--gold); }
.calc h3 { font-size: 24px; }
.calc .intro { font-size: 16px; color: var(--muted); max-width: 66ch; }
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
@media (max-width: 700px) { .calc-grid { grid-template-columns: 1fr; } }
.ctl { display: grid; gap: 4px; }
.ctl label { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
.ctl output { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); }
.radios { display: flex; gap: 14px; flex-wrap: wrap; font-size: 15px; }
.radios label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }
.meter { display: grid; gap: 6px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; }
.meter .big { font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 10px; background: #e7e0ea; border-radius: 999px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ok); }
.bar .fill.bad { background: #c0392b; }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.meter .hint { font-size: 13px; color: var(--muted); }
.verdict { font-size: 16.5px; font-weight: 600; padding: 12px 14px; border-radius: var(--radius); background: #fff; border-left: 4px solid var(--gold); }
.calc svg { width: 100%; height: auto; background: #fff; border-radius: var(--radius); }
.calc .foot { font-size: 13px; color: var(--muted); }

/* Visionneuse */
.lb { position: fixed; inset: 0; background: rgba(31, 26, 36, .9); display: none; place-items: center; padding: 24px; z-index: 50; }
.lb.open { display: grid; }
.lb figure { margin: 0; max-width: min(1200px, 100%); display: grid; gap: 12px; }
.lb img { max-height: 78vh; width: auto; margin: 0 auto; background: #fff; border-radius: var(--radius); }
.lb figcaption { color: #f1ecf3; font-size: 15px; text-align: center; max-width: 72ch; margin: 0 auto; }
.lb .x { position: absolute; top: 16px; right: 16px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 6px 14px; font: 500 14px var(--font-mono); cursor: pointer; }

/* Pied de page */
footer { background: var(--accent); color: #f4e9f1; padding: 56px 0 40px; }
footer .wrap { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
footer .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 7vw, 88px); line-height: .9; color: #fff; }
footer .big span { color: var(--gold); }
footer .small { font-size: 14px; text-align: right; display: grid; gap: 4px; }
footer a { color: #fff; }
@media (max-width: 640px) { footer .wrap { grid-template-columns: 1fr; } footer .small { text-align: left; } }
.loading { color: var(--muted); font-family: var(--font-mono); padding: 60px 0; }

/* Apparition douce (contenu visible au repos) */
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .hero-text > * { animation: rise .7s ease both; }
  .hero-text > *:nth-child(2) { animation-delay: .08s; }
  .hero-text > *:nth-child(3) { animation-delay: .16s; }
  .hero-text > *:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#accueil">Yann Leduc<span>.</span></a>
    <nav class="tabs" id="tabs" aria-label="Semestres"></nav>
  </div>
</header>
<main><div class="wrap" id="app"><p class="loading">Chargement du portfolio…</p></div></main>
<footer><div class="wrap"><a class="big" href="#accueil" style="text-decoration:none">Yann Leduc<span>.</span></a><div class="small"><span id="foot-left">Apprenti ingénieur · Arts et Métiers</span><span id="foot-right"></span><span>Visuels d'illustration générés par IA, captures et calculs issus des projets.</span></div></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image agrandie">
  <button class="x" id="lb-close" type="button">Fermer ✕</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</div>

<script>
(function () {
  var data = null;
  var app = document.getElementById("app");
  var routes = {};

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "/" + m[2] + "/" + m[1] : (iso || "");
  }
  function statusPill(s) {
    if (s === "rendu") return '<span class="pill done">Rendu</span>';
    if (s === "en-cours") return '<span class="pill live">En cours</span>';
    return '<span class="pill todo">À venir</span>';
  }
  function figs(list) {
    if (!list || !list.length) return "";
    var cls = list.length === 3 ? " n3" : "";
    return '<div class="figs' + cls + '">' + list.map(function (f) {
      return '<div class="fig"><span class="val">' + esc(f.valeur) + '</span><span class="lab">' + esc(f.label) + '</span></div>';
    }).join("") + "</div>";
  }
  function firstImage(p) {
    for (var i = 0; i < (p.parties || []).length; i++) {
      var im = p.parties[i].images || [];
      for (var j = 0; j < im.length; j++) if (/contraintes-4x/.test(im[j].src)) return im[j].src;
    }
    for (var k = 0; k < (p.parties || []).length; k++) {
      if ((p.parties[k].images || []).length) return p.parties[k].images[0].src;
    }
    return p.image || "";
  }

  function buildRoutes() {
    routes = { accueil: { view: "home" } };
    data.semestres.forEach(function (s) {
      routes[s.id] = { view: "sem", s: s };
      (s.projets || []).forEach(function (p) {
        var pk = s.id + "-" + p.id;
        routes[pk] = { view: "proj", s: s, p: p };
        (p.parties || []).forEach(function (pa) {
          routes[pk + "-" + pa.id] = { view: "proj", s: s, p: p, part: pa.id };
        });
      });
    });
  }

  function renderTabs(active) {
    document.getElementById("tabs").innerHTML = data.semestres.map(function (s, i) {
      var cur = active === s.id ? ' aria-current="page"' : "";
      var empty = (s.projets || []).length ? "" : " empty";
      return '<a class="tab' + empty + '" href="#' + s.id + '"' + cur + ' title="' + esc(s.nom + " · " + s.periode) + '">S' + (i + 1) + "</a>";
    }).join("");
  }

  function allTags() {
    var comp = [], tools = [];
    data.semestres.forEach(function (s) {
      (s.projets || []).forEach(function (p) {
        (p.parties || []).forEach(function (pa) {
          (pa.competences || []).forEach(function (c) { if (comp.indexOf(c) < 0) comp.push(c); });
          (pa.outils || []).forEach(function (t) { if (tools.indexOf(t) < 0) tools.push(t); });
        });
      });
    });
    return { comp: comp, tools: tools };
  }

  function aiTag(txt) { return '<span class="ai-tag">' + esc(txt || "Visuel généré par IA") + "</span>"; }
  function media(m, cls) {
    if (!m) return "";
    if (m.video) {
      return '<video class="' + (cls || "") + '" autoplay muted loop playsinline preload="auto" poster="' + esc(m.image) + '" aria-label="' + esc(m.alt) + '"><source src="' + esc(m.video) + '" type="video/mp4"></video>';
    }
    return '<img class="' + (cls || "") + '" src="' + esc(m.image) + '" alt="' + esc(m.alt) + '">';
  }
  function semProgress(s) {
    if (!s.debut || !s.fin) return 0;
    var a = Date.parse(s.debut), b = Date.parse(s.fin), n = Date.now();
    return Math.max(0, Math.min(1, (n - a) / (b - a)));
  }
  function currentProject() {
    for (var i = 0; i < data.semestres.length; i++) {
      var s = data.semestres[i];
      if ((s.projets || []).length) { var p = s.projets[s.projets.length - 1]; if (s.statut === "en-cours") return { s: s, p: p }; }
    }
    var last = null;
    data.semestres.forEach(function (s) { (s.projets || []).forEach(function (p) { last = { s: s, p: p }; }); });
    return last;
  }

  function rulerHTML() {
    var t0 = Date.parse(data.semestres[0].debut), t1 = Date.parse(data.semestres[data.semestres.length - 1].fin);
    var now = Math.max(0, Math.min(1, (Date.now() - t0) / (t1 - t0)));
    var segs = data.semestres.map(function (s, i) {
      var pr = semProgress(s), n = (s.projets || []).length;
      var state = pr >= 1 ? "done" : (pr > 0 ? "live" : "next");
      return '<a class="rs ' + state + '" href="#' + s.id + '">' +
        '<span class="rs-top"><span class="rs-num">S' + (i + 1) + '</span><span class="rs-year">' + esc(s.annee) + "</span></span>" +
        '<span class="rs-bar"><span style="width:' + Math.round(pr * 100) + '%"></span></span>' +
        '<span class="rs-per">' + esc(s.periode) + "</span>" +
        '<span class="rs-what">' + (n ? s.projets.map(function (p) { return esc(p.titreCourt || p.titre); }).join(" · ") : (state === "next" ? "À écrire" : "")) + "</span></a>";
    }).join("");
    return '<div class="ruler" role="list"><div class="ruler-scale" aria-hidden="true"></div><span class="ruler-now" style="left:' + (now * 100).toFixed(2) + '%" aria-hidden="true"><span>Aujourd\'hui</span></span>' + segs + "</div>";
  }

  function viewHome() {
    var pr = data.profil, t = allTags(), cur = currentProject();
    var cells = (pr.parcours || []).map(function (c) {
      return '<li><span class="k">' + esc(c.periode) + '</span><span class="v">' + esc(c.intitule) + "</span>" + (c.detail ? '<span class="d">' + esc(c.detail) + "</span>" : "") + "</li>";
    }).join("");
    var links = (pr.liens || []).map(function (l) { return '<a class="btn" href="' + esc(l.url) + '" rel="noopener">' + esc(l.label) + "</a>"; }).join("");
    var feat = "";
    if (cur) {
      var p = cur.p, key = cur.s.id + "-" + p.id;
      feat = '<section class="feature" aria-label="Projet en cours">' +
        '<a class="feature-pic" href="#' + key + '">' + media({ image: (p.couverture || p.hero || {}).image, alt: (p.couverture || p.hero || {}).alt }) + aiTag() + "</a>" +
        '<div class="feature-body"><span class="kicker">' + esc(cur.s.nom) + " · projet fil rouge</span>" +
        '<h2><a href="#' + key + '">' + esc(p.titre) + "</a></h2><p>" + esc(p.sousTitre) + "</p>" +
        figs(p.chiffres) +
        '<div class="cta"><a class="btn primary" href="#' + key + '">Ouvrir le dossier du projet</a><span class="meta">' + esc(p.equipe) + (p.encadrant ? " · encadré par " + esc(p.encadrant) : "") + "</span></div></div></section>";
    }
    app.innerHTML =
      '<section class="hero">' +
        '<div class="hero-text"><span class="kicker">' + esc(pr.titre) + '</span>' +
          '<h1 class="mega">' + esc(pr.nom) + '<span class="dot">.</span></h1>' +
          '<p class="lead">' + esc(pr.accroche) + "</p>" +
          '<div class="cta">' + (cur ? '<a class="btn primary" href="#' + cur.s.id + "-" + cur.p.id + '">Voir le projet en cours</a>' : "") + '<a class="btn" href="#accueil-parcours" data-scroll="parcours">Mon parcours</a>' + links + "</div>" +
        "</div>" +
        '<figure class="hero-media">' + media(pr.hero, "hero-vid") + '<figcaption>' + aiTag(pr.hero && pr.hero.note) + "</figcaption></figure>" +
      "</section>" +
      '<section class="block"><div class="block-head"><span class="idx">01</span><h2>Trois ans, six semestres</h2><p>Chaque semestre a sa page. Ils se remplissent au fil des projets.</p></div>' + rulerHTML() + "</section>" +
      (feat ? '<section class="block"><div class="block-head"><span class="idx">02</span><h2>En ce moment</h2><p>Le projet qui occupe le semestre.</p></div>' + feat + "</section>" : "") +
      '<section class="block two" id="parcours"><div><div class="block-head"><span class="idx">03</span><h2>Parcours</h2></div><ol class="path">' + cells + "</ol></div>" +
        '<div><div class="block-head"><span class="idx">04</span><h2>Compétences</h2><p>Tirées des projets, mises à jour toutes seules.</p></div>' +
        '<div class="skills">' + t.comp.map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("") + "</div>" +
        '<h3 class="mini">Outils et normes</h3><div class="skills">' + t.tools.map(function (c) { return '<span class="chip tool">' + esc(c) + "</span>"; }).join("") + "</div></div></section>";
  }

  function viewSem(s) {
    var i = data.semestres.indexOf(s), pr = semProgress(s);
    var html = '<div class="crumbs"><a href="#accueil">Accueil</a><span>/</span><span>' + esc(s.nom) + "</span></div>" +
      '<header class="sem-head"><span class="sem-big">S' + (i + 1) + '</span><div><span class="kicker">' + esc(s.periode) + " · " + esc(s.annee) + "</span><h1>" + esc(s.nom) + "</h1>" + (s.intro ? '<p class="lead">' + esc(s.intro) + "</p>" : "") +
      '<div class="rs-bar big"><span style="width:' + Math.round(pr * 100) + '%"></span></div><span class="meta">' + (pr >= 1 ? "Semestre terminé" : pr > 0 ? "Semestre en cours · " + Math.round(pr * 100) + " % écoulé" : "Semestre à venir") + "</span></div></header>";
    if (!(s.projets || []).length) {
      html += '<div class="empty-state"><span class="sem-ghost">S' + (i + 1) + '</span><div><strong>Page blanche, pour l\'instant</strong><p>Les projets du semestre ' + (i + 1) + " arriveront ici au fur et à mesure.</p></div></div>";
    } else {
      html += '<div class="proj-list">' + s.projets.map(function (p) {
        var c = p.couverture || p.hero || {};
        return '<a class="proj-card" href="#' + s.id + "-" + p.id + '"><div class="pic">' + (c.image ? '<img src="' + esc(c.image) + '" alt="' + esc(c.alt) + '">' + aiTag() : "") + '</div><div class="body"><span class="kicker">' + esc(p.periode) + " · " + (p.parties || []).length + " étapes</span><h2>" + esc(p.titre) + "</h2><p>" + esc(p.sousTitre) + '</p><span class="meta">' + esc(p.equipe) + (p.encadrant ? " · encadré par " + esc(p.encadrant) : "") + '</span><span class="go">Ouvrir le dossier →</span></div></a>';
      }).join("") + "</div>";
    }
    app.innerHTML = html;
  }

  function viewPart(pa, i, key) {
    var imgs = (pa.images || []).map(function (im) {
      return '<figure class="shot"><button type="button" data-lb="' + esc(im.src) + '" data-cap="' + esc(im.legende) + '" aria-label="Agrandir l\'image"><img src="' + esc(im.src) + '" alt="' + esc(im.legende) + '" loading="lazy"></button><figcaption>' + esc(im.legende) + "</figcaption></figure>";
    }).join("");
    var model = pa.modele3d ? '<div class="viewer"><model-viewer data-b64="' + esc(pa.modele3d.src) + '" data-fallback="' + esc(pa.modele3d.fallback || "") + '" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="18deg" shadow-intensity="0.6" exposure="1.05" interaction-prompt="none" alt="' + esc(pa.modele3d.legende) + '"></model-viewer><span class="cap">' + esc(pa.modele3d.legende) + "</span></div>" : "";
    var comp = (pa.competences || []).map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("");
    var tools = (pa.outils || []).map(function (c) { return '<span class="chip tool">' + esc(c) + "</span>"; }).join("");
    var deliv = (pa.livrables || []).map(function (l) {
      return "<li><span>" + esc(l.titre) + '</span><span class="dt">' + esc(l.date) + "</span>" + statusPill(l.statut) + "</li>";
    }).join("");
    var ban = pa.banniere ? '<div class="part-ban"><img src="' + esc(pa.banniere.image) + '" alt="' + esc(pa.banniere.alt) + '" loading="lazy">' + aiTag("Illustration IA") + "</div>" : "";
    return '<article class="part" id="' + key + '">' + ban +
      '<div class="part-head"><span class="n">' + pad(i + 1) + '</span><div><span class="kicker">' + esc(pa.module) + " · " + esc(pa.date) + "</span><h2>" + esc(pa.titre) + "</h2></div></div>" +
      '<div class="part-body">' +
        (pa.enBref ? '<p class="bref">' + esc(pa.enBref) + "</p>" : "") +
        '<div class="txt">' + (pa.texte || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") + "</div>" +
        figs(pa.chiffres) + (pa.calculateur === "poutre-pied" ? calcHTML() : "") + model +
        (imgs ? '<div class="gallery">' + imgs + "</div>" : "") +
        ((comp || tools) ? '<div class="tags"><div><h3>Compétences</h3><div class="skills">' + comp + "</div></div>" + (tools ? '<div><h3>Outils et normes</h3><div class="skills">' + tools + "</div></div>" : "<div></div>") + "</div>" : "") +
        (deliv ? '<div class="deliv"><h3>Livrables</h3><ul>' + deliv + "</ul></div>" : "") +
      "</div></article>";
  }

  function viewProj(s, p, partId) {
    var base = s.id + "-" + p.id;
    var steps = (p.parties || []).map(function (pa, i) {
      return '<a href="#' + base + "-" + pa.id + '" data-step="' + base + "-" + pa.id + '"><span class="n">' + pad(i + 1) + "</span><span>" + esc(pa.titre) + "</span></a>";
    }).join("");
    var h = p.hero || {};
    app.innerHTML =
      '<div class="crumbs"><a href="#accueil">Accueil</a><span>/</span><a href="#' + s.id + '">' + esc(s.nom) + "</a><span>/</span><span>" + esc(p.titreCourt || p.titre) + "</span></div>" +
      '<section class="proj-hero">' + (h.image || h.video ? '<div class="ph-media">' + media(h) + aiTag(h.note) + "</div>" : "") +
        '<div class="ph-text"><span class="kicker">' + esc(s.nom) + " · " + esc(p.periode) + "</span><h1>" + esc(p.titre) + "</h1><p>" + esc(p.sousTitre) + "</p></div></section>" +
      '<section class="proj-intro"><p class="lede">' + esc(p.resume) + '</p><dl class="facts">' +
        '<div><dt>Équipe</dt><dd>' + esc(p.equipe) + "</dd></div>" +
        (p.encadrant ? "<div><dt>Encadrant</dt><dd>" + esc(p.encadrant) + "</dd></div>" : "") +
        "<div><dt>Période</dt><dd>" + esc(p.periode) + "</dd></div>" +
        "<div><dt>Étapes</dt><dd>" + (p.parties || []).length + "</dd></div></dl></section>" +
      figs(p.chiffres) +
      planHTML(p, base) +
      '<div class="modebar"><span class="lbl">Niveau de lecture</span><div class="seg" role="group" aria-label="Niveau de lecture"><button type="button" data-mode="court">Version 2 minutes</button><button type="button" data-mode="detail">Version détaillée</button></div></div>' +
      '<div class="proj-layout" id="proj-layout"><nav class="steps" aria-label="Étapes du projet"><span class="lbl">Le dossier, étape par étape</span>' + steps + "</nav>" +
      '<div class="parts">' + (p.parties || []).map(function (pa, i) { return viewPart(pa, i, base + "-" + pa.id); }).join("") + "</div></div>";
    watchSteps();
    loadModels();
    applyMode(getMode());
    initCalc();
    initPlan();
    if (partId) {
      var el = document.getElementById(base + "-" + partId);
      if (el) { el.scrollIntoView(); setTimeout(function () { el.scrollIntoView(); }, 400); }
    } else {
      window.scrollTo(0, 0);
    }
  }

  // ---- Niveau de lecture
  function getMode() { try { return localStorage.getItem("pf-mode") || "detail"; } catch (e) { return "detail"; } }
  function applyMode(m) {
    var lay = document.getElementById("proj-layout");
    if (lay) lay.classList.toggle("court", m === "court");
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === m)); });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".seg button");
    if (!b) return;
    var m = b.getAttribute("data-mode");
    try { localStorage.setItem("pf-mode", m); } catch (err) {}
    applyMode(m);
  });

  // ---- Plan cliquable
  function planHTML(p, base) {
    var pl = p.plan;
    if (!pl) return "";
    var reps = pl.reperes || [];
    var dots = reps.map(function (r) {
      return '<a class="rep" data-rep="' + esc(r.id) + '" href="#' + base + "-" + esc(r.partie) + '" style="left:' + r.x + "%;top:" + r.y + '%" aria-label="' + esc(r.id + " : " + r.label) + '" title="' + esc(r.label) + '">' + esc(r.id) + "</a>";
    }).join("");
    var leg = reps.map(function (r) {
      var part = (p.parties || []).filter(function (x) { return x.id === r.partie; })[0];
      var idx = (p.parties || []).indexOf(part);
      return '<li><a data-rep="' + esc(r.id) + '" href="#' + base + "-" + esc(r.partie) + '"><span class="k">' + esc(r.id) + "</span><span>" + esc(r.label) + (part ? '<span class="to">→ étape ' + pad(idx + 1) + " · " + esc(part.titre) + "</span>" : "") + "</span></a></li>";
    }).join("");
    return '<section class="plan" aria-label="' + esc(pl.titre) + '"><figure class="plan-fig"><div class="inner"><img src="' + esc(pl.image) + '" alt="Vue de profil du pied, cotée en mm">' + dots + "</div></figure>" +
      "<div><h2>" + esc(pl.titre) + '</h2><p class="consigne">' + esc(pl.consigne) + '</p><ul class="legend">' + leg + "</ul></div></section>";
  }
  function initPlan() {
    document.querySelectorAll("[data-rep]").forEach(function (el) {
      var id = el.getAttribute("data-rep");
      function hot(on) { document.querySelectorAll('[data-rep="' + id + '"]').forEach(function (x) { x.classList.toggle("hot", on); }); }
      el.addEventListener("mouseenter", function () { hot(true); });
      el.addEventListener("mouseleave", function () { hot(false); });
      el.addEventListener("focus", function () { hot(true); });
      el.addEventListener("blur", function () { hot(false); });
    });
  }

  // ---- Calculateur poutre (lame droite d'épaisseur constante, encastrée à la cheville)
  function calcHTML() {
    return '<div class="calc" id="calc"><h3>À vous : souple ou solide ?</h3>' +
      '<p class="intro">Changez l\'épaisseur d\'une lame droite, encastrée à la cheville et chargée en pointe. On veut au moins 23,2 mm de flèche sous le poids (8° de plantiflexion) et une contrainte sous Re à 4 fois le poids. Essayez de tenir les deux.</p>' +
      '<div class="calc-grid"><div style="display:grid;gap:14px">' +
        '<div class="ctl"><label for="c-h">Épaisseur de la lame h <output id="o-h"></output></label><input type="range" id="c-h" min="6" max="20" step="0.1" value="11.4"></div>' +
        '<div class="ctl"><label for="c-m">Masse de l\'enfant <output id="o-m"></output></label><input type="range" id="c-m" min="15" max="40" step="0.5" value="27"></div>' +
        '<div class="ctl"><span style="font-size:15px;font-weight:600">Limite du PLA</span><div class="radios"><label><input type="radio" name="c-re" id="c-re1" value="101.3" checked> TD : 101,3 MPa</label><label><input type="radio" name="c-re" id="c-re2" value="94"> Mesurée en YZ : 94 MPa</label></div></div>' +
        '<svg id="c-svg" viewBox="0 0 215 70" role="img" aria-label="Déformée de la lame"></svg>' +
      "</div><div style=\"display:grid;gap:16px\">" +
        '<div class="meter"><div class="row"><span>Flèche en pointe, sous le poids</span><span class="big" id="r-f"></span></div><div class="bar"><div class="fill" id="b-f"></div><div class="tick" id="t-f"></div></div><span class="hint">Trait noir : 23,2 mm visés. Il faut le dépasser.</span></div>' +
        '<div class="meter"><div class="row"><span>Contrainte à 4 × le poids</span><span class="big" id="r-s"></span></div><div class="bar"><div class="fill" id="b-s"></div><div class="tick" id="t-s"></div></div><span class="hint">Trait noir : Re. Il faut rester en dessous.</span></div>' +
        '<div class="verdict" id="r-v" aria-live="polite"></div>' +
      "</div></div>" +
      '<p class="foot">Hypothèses du projet : lame de 165 mm et de 45 mm de large, E = 2 894 MPa, effort m·g (g ≈ 10) incliné de 20°. f = 4·Fy·l³ / (E·b·h³) ; σ = 4·[6·Fy·l / (b·h²) + Fx / (b·h)]. La solution retenue, en L avec une lame conique, sort de ce dilemme : 23,2 mm et 78 MPa.</p></div>';
  }
  function fr(n, d) { return n.toFixed(d).replace(".", ","); }
  function initCalc() {
    var box = document.getElementById("calc");
    if (!box) return;
    var L = 165, B = 45, E = 2894, FT = 23.2;
    var h = document.getElementById("c-h"), m = document.getElementById("c-m");
    function upd() {
      var hv = parseFloat(h.value), mv = parseFloat(m.value);
      var Re = parseFloat(box.querySelector('input[name="c-re"]:checked').value);
      var F = mv * 10, Fy = F * Math.cos(20 * Math.PI / 180), Fx = F * Math.sin(20 * Math.PI / 180);
      var f = 4 * Fy * Math.pow(L, 3) / (E * B * Math.pow(hv, 3));
      var s = 4 * (6 * Fy * L / (B * hv * hv) + Fx / (B * hv));
      document.getElementById("o-h").textContent = fr(hv, 1) + " mm";
      document.getElementById("o-m").textContent = fr(mv, 1) + " kg (" + Math.round(F) + " N)";
      document.getElementById("r-f").textContent = fr(f, 1) + " mm";
      document.getElementById("r-s").textContent = fr(s, 0) + " MPa";
      var fMax = 50, sMax = 300;
      var bf = document.getElementById("b-f"), bs = document.getElementById("b-s");
      bf.style.width = Math.min(100, f / fMax * 100) + "%"; bf.classList.toggle("bad", f < FT);
      bs.style.width = Math.min(100, s / sMax * 100) + "%"; bs.classList.toggle("bad", s > Re);
      document.getElementById("t-f").style.left = (FT / fMax * 100) + "%";
      document.getElementById("t-s").style.left = (Re / sMax * 100) + "%";
      var okF = f >= FT, okS = s <= Re, v;
      if (okF && okS) v = "Les deux tiennent : à cette masse, une lame droite suffit.";
      else if (okF) v = "Assez souple, mais à 4 × le poids la lame dépasse Re : elle casse.";
      else if (okS) v = "Elle résiste, mais elle est trop raide : la marche ne sera pas naturelle.";
      else v = "Ni assez souple, ni assez solide.";
      document.getElementById("r-v").textContent = v;
      // dessin : lame encastrée à gauche, échelle 1 mm = 1 unité, déformée vraie grandeur
      var x0 = 18, y0 = 40, n = 30, pts = [];
      for (var i = 0; i <= n; i++) {
        var x = L * i / n, w = f * (x * x * (3 * L - x)) / (2 * L * L * L);
        pts.push((x0 + x).toFixed(1) + "," + (y0 - Math.min(w, 38)).toFixed(1));
      }
      var t = Math.max(1.2, hv / 2);
      document.getElementById("c-svg").innerHTML =
        '<rect x="8" y="' + (y0 - 14) + '" width="10" height="28" fill="#e6e1e8"/>' +
        '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + (x0 + L) + '" y2="' + y0 + '" stroke="#b9b1bd" stroke-width="' + t + '" stroke-dasharray="3 2" opacity=".6"/>' +
        '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + (okF && okS ? "#00806f" : "#80276c") + '" stroke-width="' + t + '" stroke-linecap="round"/>' +
        '<line x1="' + (x0 + L + 6) + '" y1="' + y0 + '" x2="' + (x0 + L + 6) + '" y2="' + (y0 - FT) + '" stroke="#ffa300" stroke-width="1.2"/>' +
        '<text x="' + (x0 + L + 9) + '" y="' + (y0 - FT / 2 + 2) + '" font-size="6" fill="#7a4b00" font-family="IBM Plex Mono, monospace">23,2</text>' +
        '<text x="' + x0 + '" y="66" font-size="6" fill="#625b69" font-family="IBM Plex Mono, monospace">déformée vraie grandeur, l = 165 mm</text>';
    }
    box.addEventListener("input", upd);
    box.addEventListener("change", upd);
    upd();
  }

  var modelCache = {};
  function modelFallback(mv) {
    var fb = mv.getAttribute("data-fallback");
    var box = mv.parentNode;
    if (!fb) { box.remove(); return; }
    mv.replaceWith(Object.assign(document.createElement("img"), { src: fb, alt: "Modèle 3D du pied (vue de la simulation)" }));
    var cap = box.querySelector(".cap"); if (cap) cap.textContent = "Pied prothétique, version A (vue 3DExperience).";
  }
  function loadModels() {
    document.querySelectorAll("model-viewer[data-b64]").forEach(function (mv) {
      var src = mv.getAttribute("data-b64");
      mv.addEventListener("error", function () { modelFallback(mv); });
      mv.addEventListener("load", function () {
        try { mv.model.materials.forEach(function (m) { m.pbrMetallicRoughness.setBaseColorFactor([0.62, 0.36, 0.56, 1]); m.pbrMetallicRoughness.setRoughnessFactor(0.55); }); } catch (e) {}
      });
      if (/\.glb$/i.test(src)) { mv.setAttribute("src", src); setTimeout(function () { if (!customElements.get("model-viewer")) modelFallback(mv); }, 8000); return; }
      var p = modelCache[src] || (modelCache[src] = fetch(src).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
        var bin = atob(t.trim()), u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return URL.createObjectURL(new Blob([u], { type: "model/gltf-binary" }));
      }));
      p.then(function (url) { mv.setAttribute("src", url); }).catch(function () { modelFallback(mv); });
      setTimeout(function () { if (!customElements.get("model-viewer")) modelFallback(mv); }, 8000);
    });
  }

  var observer = null;
  function watchSteps() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    var links = document.querySelectorAll(".steps a");
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-step") === en.target.id); });
        }
      });
    }, { rootMargin: "-90px 0px -60% 0px" });
    document.querySelectorAll(".part").forEach(function (el) { observer.observe(el); });
  }

  function route() {
    var h = (location.hash || "").replace(/^#/, "") || "accueil";
    var r = routes[h] || routes.accueil;
    if (r.view === "home") { renderTabs(null); viewHome(); window.scrollTo(0, 0); }
    else if (r.view === "sem") { renderTabs(r.s.id); viewSem(r.s); window.scrollTo(0, 0); }
    else { renderTabs(r.s.id); viewProj(r.s, r.p, r.part); }
    document.title = r.view === "home" ? "Portfolio Yann Leduc" : (r.p ? r.p.titre : r.s.nom) + " · Yann Leduc";
  }

  // Barre de lecture
  var prog = document.getElementById("progress");
  window.addEventListener("scroll", function () {
    var h = document.documentElement.scrollHeight - innerHeight;
    prog.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + "%";
  }, { passive: true });
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-scroll]");
    if (!a) return;
    var t = document.getElementById(a.getAttribute("data-scroll"));
    if (t) { e.preventDefault(); t.scrollIntoView(); }
  });

  // Lightbox
  var lb = document.getElementById("lb");
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-lb]");
    if (b) {
      document.getElementById("lb-img").src = b.getAttribute("data-lb");
      document.getElementById("lb-img").alt = b.getAttribute("data-cap");
      document.getElementById("lb-cap").textContent = b.getAttribute("data-cap");
      lb.classList.add("open");
      document.getElementById("lb-close").focus();
    } else if (e.target === lb || e.target.id === "lb-close") {
      lb.classList.remove("open");
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") lb.classList.remove("open"); });

  fetch("content/portfolio.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      data = d;
      buildRoutes();
      document.getElementById("foot-right").textContent = "Mis à jour le " + fmtDate(d.maj);
      route();
      window.addEventListener("hashchange", route);
    })
    .catch(function () {
      app.innerHTML = '<div class="empty-state"><strong>Le contenu n\'a pas pu être chargé</strong>Rechargez la page. Si le problème persiste, le fichier de contenu est peut-être en cours de mise à jour.</div>';
    });
})();
</script>
</body>
