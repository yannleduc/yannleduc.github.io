<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 -12 290 172" font-family="IBM Plex Mono, ui-monospace, monospace">
  <!-- Vue de profil du pied prothétique, version A. Unités : mm, y_svg = 125 - y -->
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#f4e9f1"/>
      <line x1="0" y1="0" x2="0" y2="4" stroke="#80276c" stroke-width="0.45" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 z" fill="#625b69"/>
    </marker>
  </defs>

  <!-- sol -->
  <line x1="-20" y1="128" x2="245" y2="128" stroke="#c9c1cd" stroke-width="0.6"/>
  <g stroke="#d9d2dc" stroke-width="0.5">
    <line x1="-14" y1="128" x2="-18" y2="132"/><line x1="6" y1="128" x2="2" y2="132"/><line x1="26" y1="128" x2="22" y2="132"/>
    <line x1="46" y1="128" x2="42" y2="132"/><line x1="66" y1="128" x2="62" y2="132"/><line x1="86" y1="128" x2="82" y2="132"/>
    <line x1="106" y1="128" x2="102" y2="132"/><line x1="126" y1="128" x2="122" y2="132"/><line x1="146" y1="128" x2="142" y2="132"/>
    <line x1="166" y1="128" x2="162" y2="132"/><line x1="186" y1="128" x2="182" y2="132"/><line x1="206" y1="128" x2="202" y2="132"/>
    <line x1="226" y1="128" x2="222" y2="132"/>
  </g>

  <!-- adaptateur pyramidal (fantôme) -->
  <path d="M30,15 L56,15 L52,7 L34,7 Z" fill="none" stroke="#9a91a0" stroke-width="0.6" stroke-dasharray="2 1.5"/>
  <line x1="43" y1="7" x2="43" y2="-4" stroke="#9a91a0" stroke-width="0.6" stroke-dasharray="2 1.5"/>

  <!-- déformée sous la charge de marche (pointe relevée de 23,2 mm) -->
  <path d="M30,125 C110,124 170,116 218,102" fill="none" stroke="#ffa300" stroke-width="1.1" stroke-dasharray="3 2"/>
  <line x1="220" y1="118.5" x2="220" y2="102.5" stroke="#ffa300" stroke-width="0.6" marker-end="url(#arr)"/>

  <!-- profil du pied -->
  <path d="M0,125 L220,125 L220,118.5 L34,106 Q30,106 30,102 L30,34 L75,34 L75,15 L11,15 L11,106 L0,119 Z"
        fill="url(#hatch)" stroke="#80276c" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- trous de l'adaptateur -->
  <g stroke="#80276c" stroke-width="0.5" stroke-dasharray="1.5 1.2">
    <line x1="34" y1="15" x2="34" y2="34"/><line x1="40" y1="15" x2="40" y2="34"/>
    <line x1="56" y1="15" x2="56" y2="34"/><line x1="62" y1="15" x2="62" y2="34"/>
  </g>

  <!-- cotes -->
  <g stroke="#625b69" stroke-width="0.45" fill="none">
    <line x1="0" y1="129" x2="0" y2="146"/><line x1="220" y1="126" x2="220" y2="146"/>
    <line x1="1" y1="143" x2="219" y2="143" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="10" y1="15" x2="-24" y2="15"/><line x1="-1" y1="125" x2="-24" y2="125"/>
    <line x1="-20" y1="16" x2="-20" y2="124" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="11" y1="13" x2="11" y2="4"/><line x1="30" y1="34" x2="30" y2="4"/>
    <line x1="12" y1="6" x2="29" y2="6" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="221" y1="118.5" x2="236" y2="118.5"/><line x1="221" y1="125" x2="236" y2="125"/>
  </g>
  <g fill="#625b69" font-size="6.2" text-anchor="middle">
    <text x="110" y="141">220</text>
    <text x="-23" y="72" transform="rotate(-90 -23 72)">110</text>
    <text x="20.5" y="3.5">19</text>
    <text x="240" y="124">6,5</text>
  </g>
  <text x="206" y="94" fill="#a86b00" font-size="5.6" text-anchor="end">déformée sous la marche</text>
</svg>
